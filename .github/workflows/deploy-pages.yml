name: Red-green test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full-stack green gate
        run: npm run test:all

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload production build
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  production-smoke:
    if: github.event_name == 'push'
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed document and bundle
        shell: bash
        run: |
          site_url="https://loopasam.github.io/doudou-battler/"
          html="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$site_url")"
          grep --fixed-strings '<title>Doudou Battler</title>' <<< "$html"
          asset_path="$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' <<< "$html" | head -n 1)"
          test -n "$asset_path"
          curl --fail --silent --show-error --head --retry 5 --retry-all-errors "https://loopasam.github.io${asset_path}"

          studio_url="${site_url}studio/"
          studio_html="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$studio_url")"
          grep --fixed-strings '<title>Doudou Art Lab</title>' <<< "$studio_html"
          grep --fixed-strings 'From cuddle' <<< "$studio_html"
          curl --fail --silent --show-error --head --retry 5 --retry-all-errors "${site_url}art-studio/doudou-original.webp"
          curl --fail --silent --show-error --head --retry 5 --retry-all-errors "${site_url}art-studio/fort-knight-concept.png"
